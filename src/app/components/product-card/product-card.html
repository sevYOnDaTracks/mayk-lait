<div class="product-visual" [class.product-visual--compact]="compact()">
  <svg aria-hidden="true" viewBox="0 0 32 32">
    <rect x="4.5" y="5.5" width="23" height="21" rx="2"></rect>
    <circle cx="11" cy="12" r="2"></circle>
    <path d="m6.5 24 7.6-7.8 4.3 4.1 2.7-2.7 4.4 4.7"></path>
  </svg>
  <strong>{{ product().name }}</strong>
  <span>or <u>browse files</u></span>
</div>

<div class="product-meta">
  <span>{{ product().eyebrow }}</span>
  <strong>{{ product().price.toFixed(2) }} €</strong>
</div>
<h2>{{ product().name }}</h2>
@if (!compact()) {
  <p class="product-description">{{ product().description }}</p>
}
<button class="outline-button product-add" type="button" (click)="addToCart()">
  <svg aria-hidden="true" viewBox="0 0 24 24">
    <path d="M8.2 8.1V6a3.8 3.8 0 0 1 7.6 0v2.1"></path>
    <path d="M6.6 8.1h10.8l-.7 11H7.3l-.7-11Z"></path>
  </svg>
  Add to cart
</button>
